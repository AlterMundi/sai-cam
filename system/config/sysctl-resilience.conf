# SAI-CAM kernel resilience settings
# Applied by install.sh to /etc/sysctl.d/99-sai-cam-resilience.conf

# Auto-reboot 5 s after kernel panic / oops
kernel.panic = 5
kernel.panic_on_oops = 1

# Reboot on OOM instead of hanging in degraded state
vm.panic_on_oom = 1

# Reduce swap thrashing on Pi (SD card protection)
vm.swappiness = 10
vm.min_free_kbytes = 16384

# Tighter TCP keepalive for long-lived upload connections over flaky forest links
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
